# Maintainers' live demo only. Copies each push to main into the AWS CodeCommit
# repository that feeds the maintainers' demo pipelines. To run the sample
# yourself, connect your pipelines to GitHub with an AWS CodeConnections
# connection as the README describes; you do not need this workflow.
#
# It does nothing outside aws-samples, and it skips cleanly until all three
# settings exist: secret DEMO_SYNC_ROLE_ARN, variables DEMO_SYNC_CODECOMMIT_URL
# and DEMO_SYNC_REGION. The push is a plain fast-forward: if the CodeCommit
# branch has moved elsewhere, git refuses it and this job fails.
name: Maintainer demo source sync
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: maintainer-demo-source-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner == 'aws-samples'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip unless the demo account is configured
        id: config
        env:
          ROLE_ARN: ${{ secrets.DEMO_SYNC_ROLE_ARN }}
          REPO_URL: ${{ vars.DEMO_SYNC_CODECOMMIT_URL }}
          REGION: ${{ vars.DEMO_SYNC_REGION }}
        run: |
          if [ -z "$ROLE_ARN" ] || [ -z "$REPO_URL" ] || [ -z "$REGION" ]; then
            echo 'Demo source sync is not configured for this repository; skipping.' >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$REPO_URL" =~ ^https://git-codecommit\.[a-z0-9-]+\.amazonaws\.com/v1/repos/[A-Za-z0-9._-]+$ ]]; then
            echo 'DEMO_SYNC_CODECOMMIT_URL is not a CodeCommit HTTPS URL.' >&2
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Check out the pushed commit with full history
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assume the demo sync role via OIDC
        if: steps.config.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.DEMO_SYNC_ROLE_ARN }}
          aws-region: ${{ vars.DEMO_SYNC_REGION }}
          role-duration-seconds: 900
          role-session-name: demo-source-sync-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Fast-forward CodeCommit main to this commit
        if: steps.config.outputs.enabled == 'true'
        env:
          REPO_URL: ${{ vars.DEMO_SYNC_CODECOMMIT_URL }}
        run: |
          git config --global credential.helper '!aws codecommit credential-helper $@'
          git config --global credential.UseHttpPath true
          git push "$REPO_URL" "${GITHUB_SHA:?GITHUB_SHA is unset}:refs/heads/main"
          git ls-remote "$REPO_URL" refs/heads/main
